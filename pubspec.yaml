name: international_transport_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.0.0 # للاتصال بقاعدة البيانات والـ Auth
  provider: ^6.0.5         # لإدارة حالة التطبيق (State Management)
  pdf: ^3.10.8             # لتوليد فواتير وكشوفات الـ PDF للسكرتيرة
  printing: ^5.14.3        # لطباعة الفواتير مباشرة من التطبيق
  excel: ^4.0.0            # لتوليد ملفات Excel بصيغة XLSX
  share_plus: ^12.0.0      # لمشاركة/تنزيل ملفات Excel عبر نظام المشاركة بالـ OS
  intl: ^0.20.2
  image_picker: ^1.0.7
  file_picker: ^11.0.2
  google_mlkit_text_recognition: ^0.16.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^13.0.0
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  internet_connection_checker: ^3.0.1
  url_launcher: ^6.3.0
  decimal: ^2.3.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  supabase: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
