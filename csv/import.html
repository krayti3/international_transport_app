function decodeCp1252(buffer) {
  const bytes = new Uint8Array(buffer);
  let result = '';
  for (let i = 0; i < bytes.length; i++) {
    const b = bytes[i];
    if (b < 0x80) {
      result += String.fromCharCode(b);
    } else if (b === 0x80) result += '€';
    else if (b === 0x82) result += '‚';
    else if (b === 0x83) result += 'ƒ';
    else if (b === 0x84) result += '„';
    else if (b === 0x85) result += '…';
    else if (b === 0x86) result += '†';
    else if (b === 0x87) result += '‡';
    else if (b === 0x88) result += 'ˆ';
    else if (b === 0x89) result += '‰';
    else if (b === 0x8A) result += 'Š';
    else if (b === 0x8B) result += '‹';
    else if (b === 0x8C) result += 'Œ';
    else if (b === 0x8E) result += 'Ž';
    else if (b === 0x91) result += '‘';
    else if (b === 0x92) result += '’';
    else if (b === 0x93) result += '“';
    else if (b === 0x94) result += '”';
    else if (b === 0x95) result += '•';
    else if (b === 0x96) result += '–';
    else if (b === 0x97) result += '—';
    else if (b === 0x98) result += '˜';
    else if (b === 0x99) result += '™';
    else if (b === 0x9A) result += 'š';
    else if (b === 0x9B) result += '›';
    else if (b === 0x9C) result += 'œ';
    else if (b === 0x9E) result += 'ž';
    else if (b === 0x9F) result += 'Ÿ';
    else result += String.fromCharCode(b);
  }
  return result;
}

function parseCsv(text, delimiter) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length === 0) return { headers: [], rows: [] };
  const headers = lines[0].split(delimiter);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(delimiter);
    const row = {};
    for (let j = 0; j < headers.length; j++) {
      row[headers[j]] = cols[j] !== undefined ? cols[j] : '';
    }
    rows.push(row);
  }
  return { headers, rows };
}

function parseNumber(val) {
  if (!val || val.trim() === '') return null;
  const v = val.trim().replace(/ /g, '');
  if (!v) return null;
  const normalized = v.replace(/\./g, '').replace(',', '.');
  const f = parseFloat(normalized);
  if (isNaN(f)) return 0;
  return f;
}

function parseDate(val) {
  if (!val || val.trim() === '') return null;
  const m = val.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  return m[3] + '-' + m[2] + '-' + m[1];
}

function nullify(val) {
  if (val === null || val === undefined) return null;
  const s = String(val).trim();
  return s || null;
}

async function supabasePost(table, body) {
  const url = SUPABASE_URL + '/rest/v1/' + table;
  const data = JSON.stringify(body);
  for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: HEADERS,
        body: data,
        mode: 'cors'
      });
      const text = await resp.text();
      if (!resp.ok) {
        if (resp.status === 429) {
          await new Promise(r => setTimeout(r, RETRY_DELAY * (attempt + 1)));
          continue;
        }
        return { ok: false, status: resp.status, error: text };
      }
      if (!text.trim()) return { ok: true, data: [] };
      return { ok: true, data: JSON.parse(text) };
    } catch (e) {
      if (attempt < MAX_RETRIES - 1) {
        await new Promise(r => setTimeout(r, RETRY_DELAY * (attempt + 1)));
        continue;
      }
      return { ok: false, error: String(e) };
    }
  }
}

function chunk(arr, size) {
  const chunks = [];
  for (let i = 0; i < arr.length; i += size) chunks.push(arr.slice(i, i + size));
  return chunks;
}

async function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

      const jid = parseInt(rid);
      if (isNaN(jid)) { skipped.truck_maintenance++; continue; }
      if (!trucksMap[jid]) { skipped.truck_maintenance++; continue; }
      const catId = row['categorie'];
      const expenseType = catId ? (categories[catId] || 'other') : 'other';
      const description = nullify(row['JobName']);
      const dueDate = parseDate(row['ExpectedCompletionDate']);
      jobsData.push({
        truck_id: trucksMap[jid],
        expense_type: expenseType,
        amount: 0,
        description: description || '',
        due_date: dueDate
      });
    }

    for (const batch of chunk(jobsData, BATCH_SIZE)) {
      const res = await supabasePost('truck_maintenance', batch);
      if (res.ok) stats.truck_maintenance += res.data.length;
      else {
        errors.push('truck_maintenance insert: ' + (res.error || res.status));
        log('  ERROR truck_maintenance: ' + (res.error || res.status));
      }
    }
    log('  truck_maintenance inserted: ' + stats.truck_maintenance);
  }

  const total = stats.clients + stats.trucks + stats.trailers + stats.drivers + stats.trip_orders + stats.truck_maintenance;
  log('=== IMPORT SUMMARY ===');
  log('clients: ' + stats.clients);
  log('trucks: ' + stats.trucks);
  log('trailers: ' + stats.trailers);
  log('drivers: ' + stats.drivers);
  log('trip_orders: ' + stats.trip_orders);
  log('truck_maintenance: ' + stats.truck_maintenance);
  log('TOTAL: ' + total);
  log('=== SKIPPED ===');
  log('clients: ' + skipped.clients);
  log('trucks: ' + skipped.trucks);
  log('trailers: ' + skipped.trailers);
  log('drivers: ' + skipped.drivers);
  log('trip_orders: ' + skipped.trip_orders);
  log('truck_maintenance: ' + skipped.truck_maintenance);
  log('=== ERRORS ===');
  if (errors.length === 0) log('None');
  else {
    for (const e of errors.slice(0, 20)) log(e);
  }
  log('NO schema/DDL was run.');
}

document.getElementById('importBtn').addEventListener('click', importAll);
document.getElementById('clearBtn').addEventListener('click', () => {
  logEl.textContent = '';
});
</script>
</body>
